<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Попутка — райдшеринг</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Основной контейнер приложения -->
    <div id="app">
        <!-- Верхняя панель -->
        <header id="header">
            <button id="backBtn" class="icon-btn" onclick="goBack()">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h1 id="screenTitle">Попутка</h1>
            <button id="menuBtn" class="icon-btn" onclick="toggleMenu()">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
        </header>

        <!-- Область контента (экраны будут вставляться сюда) -->
        <main id="content"></main>

        <!-- Нижняя панель навигации -->
        <nav id="tabBar">
            <button class="tab-btn active" data-screen="search" onclick="navigateTo('search')">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Поиск</span>
            </button>
            <button class="tab-btn" data-screen="create" onclick="navigateTo('create')">
                <i class="fa-solid fa-plus-circle"></i>
                <span>Создать</span>
            </button>
            <button class="tab-btn" data-screen="myRides" onclick="navigateTo('myRides')">
                <i class="fa-solid fa-car"></i>
                <span>Поездки</span>
            </button>
            <button class="tab-btn" data-screen="requests" onclick="navigateTo('requests')">
                <i class="fa-solid fa-clipboard-list"></i>
                <span>Заявки</span>
            </button>
            <button class="tab-btn" data-screen="profile" onclick="navigateTo('profile')">
                <i class="fa-solid fa-user"></i>
                <span>Профиль</span>
            </button>
        </nav>
    </div>

    <!-- Модальное окно (универсальное) -->
    <div id="modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Toast-уведомления -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
